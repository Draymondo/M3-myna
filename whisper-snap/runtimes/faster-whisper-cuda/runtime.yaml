# faster-whisper (CUDA CTranslate2) serving the Myna session API.
#
# The cpu runtime is the base snap's venv, whose ctranslate2 wheel is already
# the CUDA build. The component adds what that venv lacks on a GPU: the NVIDIA
# cuBLAS/NVRTC pip libraries, and onnxruntime for the large models' VAD
# (requirements.txt), under `site-packages/`, ahead of the venv on PYTHONPATH.
#
# The nvidia-*-cu12 wheels lay their .so files out under
# site-packages/nvidia/<lib>/lib; CTranslate2 dlopens cuBLAS from
# LD_LIBRARY_PATH, and cuBLAS finds NVRTC itself.
name: faster-whisper-cuda

servers:
  myna:
    protocol: ws+unix
    base-path: /v1

environment:
  - PYTHONPATH=$SNAP_COMPONENTS/gpu-nvidia/site-packages
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/gpu-nvidia/site-packages/nvidia/cublas/lib

components:
  - gpu-nvidia
