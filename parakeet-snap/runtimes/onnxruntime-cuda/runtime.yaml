# onnxruntime (CUDA) serving the Myna session API.
#
# The cpu runtime is the base snap's venv. The GPU stack is a component: the
# `onnxruntime-cuda` part installs onnxruntime-gpu and the NVIDIA CUDA 13 and
# cuDNN 9 pip libraries under site-packages/, and nothing else. PYTHONPATH puts
# it ahead of the venv, so its onnxruntime shadows the venv's CPU build while
# myna and every other module still come from the venv. libcuda.so.1 comes
# from the host driver through the opengl interface.
name: onnxruntime-cuda

servers:
  myna:
    protocol: ws+unix
    base-path: /v1

environment:
  - PYTHONPATH=$SNAP_COMPONENTS/gpu-nvidia/site-packages
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/gpu-nvidia/site-packages/nvidia/cu13/lib
  - LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$SNAP_COMPONENTS/gpu-nvidia/site-packages/nvidia/cudnn/lib

components:
  - gpu-nvidia
